<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>FJ Media · vista previa</title>
<style>
  :root { --navy:#0d1a2a; --navy-2:#13263b; --orange:#e15412; --ink:#f4f6f9; --muted:#9fb0c3; }
  * { box-sizing: border-box; margin: 0; }
  body { min-height: 100svh; background: var(--navy); color: var(--ink); font: 16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 28px 16px 48px; }
  main { max-width: 640px; margin: 0 auto; }
  .brand { font-weight: 800; font-size: 2.6rem; letter-spacing: -.02em; }
  .brand b { color: var(--orange); }
  .brand span { display: block; font-weight: 500; font-size: .8rem; letter-spacing: .55em; text-indent: .55em; margin-top: 2px; }
  h1 { font-size: 1.35rem; margin: 28px 0 6px; }
  p { color: var(--muted); }
  .tag { display: inline-block; margin-top: 14px; padding: 4px 12px; border-radius: 99px; background: var(--navy-2); border-left: 3px solid var(--orange); font-size: .85rem; color: var(--ink); }
  h2 { font-size: 1rem; margin: 36px 0 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--orange); }
  ul { list-style: none; padding: 0; }
  li { padding: 10px 0; border-bottom: 1px solid var(--navy-2); display: grid; grid-template-columns: 6.5rem 1fr; gap: 10px; }
  time { color: var(--muted); font-size: .85rem; font-variant-numeric: tabular-nums; }
  .meta { margin-top: 28px; font-size: .8rem; color: var(--muted); }
</style>
</head>
<body>
<main>
  <div class="brand"><b>FJ</b><span>MEDIA</span></div>
  <h1>Sitio en construcción</h1>
  <p>Esta es la vista previa privada del nuevo sitio de FJ Media. Se actualiza sola cada vez que se sube un cambio.</p>
  <span class="tag">Versión de prueba · no indexada</span>

  <h2>Últimos cambios</h2>
  <ul>
<!--CAMBIOS-->
  </ul>

  <p class="meta">Publicado el {{FECHA}} · versión {{SHA}}</p>
</main>
</body>
</html>
